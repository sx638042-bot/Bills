<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7">
<meta name="description" content="账单明细查询 — 按大类分类 / 耐用分类筛选并实时汇总金额">
<title>账单查询</title>
<style>
/* ============ 基础重置（移动 / 微信内适配） ============ */
html{
  /* 关键：阻止微信 Android X5 内核的“字体大小”设置放大页面文字 */
  -webkit-text-size-adjust:100% !important;
  text-size-adjust:100% !important;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  margin:0; padding:0;
  background:#f4f5f7; color:#1f2328;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100% !important;
}
img{ max-width:100%; }
button,input{ font-family:inherit; font-size:inherit; color:inherit; }

/* ============ 顶部汇总栏 ============ */
#topbar{
  position:-webkit-sticky; position:sticky; top:0; z-index:20;
  background:#fff;
  padding:12px 16px calc(10px) 16px;
  padding-top:calc(12px + constant(safe-area-inset-top));
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid #eceef1;
  box-shadow:0 1px 6px rgba(20,24,31,.05);
}
.tb-title{
  display:-webkit-flex; display:flex; align-items:baseline; justify-content:space-between;
  font-size:13px; color:#8b919a;
}
.tb-title .src{ font-size:12px; color:#a8aeb8; }
#total{
  margin-top:4px;
  font-size:32px; font-weight:700; letter-spacing:-.5px; color:#d93025;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
}
#total .unit{ font-size:18px; font-weight:600; margin-right:2px; }
#count{ margin-top:2px; font-size:12px; color:#8b919a; }

/* ============ 筛选区 ============ */
#panel{
  background:#fff; padding:10px 0 12px; margin-bottom:8px;
  border-bottom:1px solid #eceef1;
}
.frow{ padding:0 16px; }
.frow + .frow{ margin-top:10px; }
.flabel{
  font-size:12px; color:#8b919a; margin-bottom:6px;
  display:-webkit-flex; display:flex; align-items:center; justify-content:space-between;
}
.flabel b{ color:#5a626c; font-weight:600; }
.reset{
  border:0; background:none; padding:2px 4px; color:#2d6ae0; font-size:12px;
  touch-action:manipulation;
}
.chips{
  display:-webkit-flex; display:flex; -webkit-flex-wrap:nowrap; flex-wrap:nowrap;
  overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:4px; margin:0 -16px; padding-left:16px; padding-right:16px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{ display:none; }
.chip{
  -webkit-flex:0 0 auto; flex:0 0 auto;
  display:inline-block; white-space:nowrap;
  padding:6px 13px; margin:0 6px 2px 0;
  border:1px solid #e3e6ea; border-radius:16px;
  background:#fff; color:#5a626c; font-size:13px;
  touch-action:manipulation; cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.chip:active{ background:#f0f2f5; }
.chip .amt{ font-size:11px; color:#a8aeb8; margin-left:4px; }
.chip.on{ background:#2d6ae0; border-color:#2d6ae0; color:#fff; }
.chip.on .amt{ color:rgba(255,255,255,.75); }

/* 搜索 + 排序 */
.toolbar{
  display:-webkit-flex; display:flex; padding:10px 16px 0;
}
.search{
  -webkit-flex:1 1 auto; flex:1 1 auto; min-width:0;
  border:1px solid #e3e6ea; border-radius:8px; background:#fafbfc;
  padding:8px 11px; font-size:14px; outline:none;
  -webkit-appearance:none; appearance:none;
}
.search:focus{ border-color:#2d6ae0; background:#fff; }
.sbtn{
  -webkit-flex:0 0 auto; flex:0 0 auto; margin-left:8px;
  border:1px solid #e3e6ea; border-radius:8px; background:#fafbfc;
  padding:8px 11px; font-size:13px; color:#5a626c; white-space:nowrap;
  touch-action:manipulation;
}
.sbtn:active{ background:#f0f2f5; }

/* ============ 分类占比 ============ */
#summary{
  background:#fff; padding:12px 16px; margin-bottom:8px;
  border-bottom:1px solid #eceef1;
}
.sum-h{ font-size:12px; color:#8b919a; margin-bottom:8px; }
.bar-row{ margin-bottom:8px; }
.bar-row:last-child{ margin-bottom:0; }
.bar-t{
  display:-webkit-flex; display:flex; justify-content:space-between;
  font-size:13px; color:#3c424a; margin-bottom:4px;
}
.bar-t .v{ color:#5a626c; font-variant-numeric:tabular-nums; }
.bar-bg{ height:6px; background:#f0f2f5; border-radius:3px; overflow:hidden; }
.bar-fg{ height:6px; border-radius:3px; transition:width .25s ease; }

/* ============ 明细列表 ============ */
#list{ padding:0 0 24px; }
.grp-date{
  padding:10px 16px 6px; font-size:12px; color:#8b919a;
  display:-webkit-flex; display:flex; justify-content:space-between;
}
.card{
  display:-webkit-flex; display:flex; align-items:flex-start; justify-content:space-between;
  background:#fff; margin:0 12px 8px; padding:11px 13px;
  border-radius:10px; box-shadow:0 1px 3px rgba(20,24,31,.05);
}
.card .left{ min-width:0; -webkit-flex:1 1 auto; flex:1 1 auto; padding-right:10px; }
.card .name{
  font-size:15px; color:#1f2328; font-weight:600; line-height:1.35;
  word-break:break-all;
}
.card .meta{ margin-top:4px; font-size:12px; color:#8b919a; line-height:1.5; word-break:break-all; }
.card .meta .dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  margin-right:4px; vertical-align:1px;
}
.card .tags{ margin-top:5px; }
.tag{
  display:inline-block; font-size:11px; padding:2px 7px; border-radius:4px;
  background:#f2f4f7; color:#6b7280; margin:0 5px 3px 0;
}
.tag.dur{ background:#eef4ff; color:#2d6ae0; }
.card .right{ -webkit-flex:0 0 auto; flex:0 0 auto; text-align:right; }
.card .money{
  font-size:16px; font-weight:700; color:#d93025; white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.card .when{ margin-top:5px; font-size:11px; color:#a8aeb8; white-space:nowrap; }

.empty{ text-align:center; padding:48px 20px; color:#a8aeb8; font-size:14px; }
.empty .big{ font-size:34px; display:block; margin-bottom:8px; opacity:.5; }

#foot{
  text-align:center; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  font-size:11px; color:#b3b9c2; line-height:1.7;
}
#foot .sp{ padding-bottom:constant(safe-area-inset-bottom); padding-bottom:env(safe-area-inset-bottom); }
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-title">
    <span>筛选后合计支出</span>
    <span class="src" id="src"></span>
  </div>
  <div id="total"><span class="unit">¥</span><span id="totalNum">0.00</span></div>
  <div id="count">共 0 笔</div>
</header>

<section id="panel">
  <div class="frow">
    <div class="flabel"><b>大类分类</b><button class="reset" id="resetCat">重置</button></div>
    <div class="chips" id="catChips"></div>
  </div>
  <div class="frow">
    <div class="flabel"><b>耐用分类</b><button class="reset" id="resetDur">重置</button></div>
    <div class="chips" id="durChips"></div>
  </div>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="搜索交易对象 / 商品" autocomplete="off">
    <button class="sbtn" id="sortBtn">按时间 ↓</button>
  </div>
</section>

<section id="summary">
  <div class="sum-h">当前筛选 · 大类占比</div>
  <div id="bars"></div>
</section>

<main id="list"></main>

<footer id="foot"><span class="sp">数据由本地表格离线生成 · 单文件网页，无需联网</span></footer>

(function () {
  'use strict';

  var PALETTE = ['#2d6ae0','#e8453c','#f5a623','#12b886','#8b5cf6',
                 '#0ea5e9','#f06595','#5a626c','#20c997','#d93025'];

  var rows = (DATA && DATA.rows) ? DATA.rows : [];
  var meta = (DATA && DATA.meta) ? DATA.meta : {};

  // 状态
  var selCat = [];   // 选中的大类（空 = 全部）
  var selDur = [];   // 选中的耐用分类（空 = 全部）
  var keyword = '';
  var sortMode = 'date'; // date | amount

  var colorOf = {};
  for (var i = 0; i < (meta.categories || []).length; i++) {
    colorOf[meta.categories[i]] = PALETTE[i % PALETTE.length];
  }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function money(n) {
    var neg = n < 0; var v = Math.abs(n);
    var s = (Math.round(v * 100) / 100).toFixed(2);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + parts.join('.');
  }
  function inArr(arr, v) { return arr.indexOf(v) >= 0; }
  function toggle(arr, v) {
    var k = arr.indexOf(v);
    if (k >= 0) arr.splice(k, 1); else arr.push(v);
  }

  /* ---------- 渲染筛选按钮 ---------- */
  function buildChips() {
    var catHtml = '<span class="chip' + (selCat.length ? '' : ' on') + '" data-type="cat" data-val="">全部</span>';
    var catSum = {};
    for (var a = 0; a < rows.length; a++) catSum[rows[a].c] = (catSum[rows[a].c] || 0) + rows[a].a;
    for (var i = 0; i < (meta.categories || []).length; i++) {
      var c = meta.categories[i];
      catHtml += '<span class="chip' + (inArr(selCat, c) ? ' on' : '') + '" data-type="cat" data-val="' + esc(c) + '">'
        + esc(c) + '<span class="amt">' + money(catSum[c] || 0) + '</span></span>';
    }
    $('catChips').innerHTML = catHtml;

    var durHtml = '<span class="chip' + (selDur.length ? '' : ' on') + '" data-type="dur" data-val="">全部</span>';
    var durSum = {};
    for (var b = 0; b < rows.length; b++) durSum[rows[b].u] = (durSum[rows[b].u] || 0) + rows[b].a;
    for (var j = 0; j < (meta.durations || []).length; j++) {
      var d = meta.durations[j];
      durHtml += '<span class="chip' + (inArr(selDur, d) ? ' on' : '') + '" data-type="dur" data-val="' + esc(d) + '">'
        + esc(d) + '<span class="amt">' + money(durSum[d] || 0) + '</span></span>';
    }
    $('durChips').innerHTML = durHtml;
  }

  /* ---------- 金额统一用“分”累加，避免浮点误差 ---------- */
  function cents(n) { return Math.round(n * 100); }

  function currentRows() {
    var out = [];
    var kw = keyword.replace(/^\s+|\s+$/g, '').toLowerCase();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (selCat.length && !inArr(selCat, r.c)) continue;
      if (selDur.length && !inArr(selDur, r.u)) continue;
      if (kw) {
        var hay = (r.p + ' ' + r.g + ' ' + r.c + ' ' + r.u + ' ' + r.d).toLowerCase();
        if (hay.indexOf(kw) < 0) continue;
      }
      out.push(r);
    }
    if (sortMode === 'amount') {
      out.sort(function (x, y) { return y.a - x.a; });
    } else {
      out.sort(function (x, y) {
        var kx = (x.d || '0000-00-00') + (x.t || '');
        var ky = (y.d || '0000-00-00') + (y.t || '');
        return kx < ky ? -1 : (kx > ky ? 1 : 0);
      });
      out.reverse();
    }
    return out;
  }

  /* ---------- 主渲染 ---------- */
  function render() {
    var list = currentRows();

    var totalC = 0, byCat = {}, catOrder = [];
    for (var i = 0; i < list.length; i++) {
      totalC += cents(list[i].a);
      var c = list[i].c;
      if (byCat[c] === undefined) { byCat[c] = 0; catOrder.push(c); }
      byCat[c] += cents(list[i].a);
    }
    catOrder.sort(function (a, b) { return byCat[b] - byCat[a]; });

    $('totalNum').innerHTML = money(totalC / 100);
    $('count').innerHTML = '共 ' + list.length + ' 笔'
      + (selCat.length || selDur.length || keyword ? '（全量 ' + rows.length + ' 笔）' : '');
    $('src').innerHTML = esc(meta.source || '') + (meta.generatedAt ? ' · ' + esc(meta.generatedAt) : '');

    // 占比条形图
    if (!list.length) {
      $('bars').innerHTML = '<div class="bar-t"><span>暂无数据</span></div>';
    } else {
      var bh = '';
      for (var k = 0; k < catOrder.length; k++) {
        var name = catOrder[k];
        var val = byCat[name] / 100;
        var pct = totalC ? (byCat[name] / totalC * 100) : 0;
        bh += '<div class="bar-row">'
          + '<div class="bar-t"><span>' + esc(name) + '</span>'
          + '<span class="v">¥' + money(val) + ' · ' + pct.toFixed(1) + '%</span></div>'
          + '<div class="bar-bg"><div class="bar-fg" style="width:' + pct.toFixed(2) + '%;background:'
          + (colorOf[name] || PALETTE[0]) + '"></div></div></div>';
      }
      $('bars').innerHTML = bh;
    }

    // 明细
    if (!list.length) {
      $('list').innerHTML = '<div class="empty"><span class="big">🍃</span>没有符合条件的记录<br>试试清除筛选或关键词</div>';
      return;
    }
    var html = '', lastDate = '';
    for (var m = 0; m < list.length; m++) {
      var r = list[m];
      if (sortMode === 'date' && r.d && r.d !== lastDate) {
        lastDate = r.d;
        html += '<div class="grp-date"><span>' + esc(r.d) + '</span></div>';
      }
      var title = r.g && r.g !== '/' ? r.g : (r.p || '—');
      var metaLine = '';
      if (r.p) metaLine += esc(r.p);
      if (r.p && r.g && r.g !== '/') metaLine += ' · ' + esc(r.g);
      if (!metaLine) metaLine = '—';

      html += '<div class="card">'
        + '<div class="left">'
        +   '<div class="name">' + esc(title) + '</div>'
        +   '<div class="meta"><span class="dot" style="background:' + (colorOf[r.c] || PALETTE[0]) + '"></span>' + metaLine + '</div>'
        +   '<div class="tags"><span class="tag" style="color:' + (colorOf[r.c] || PALETTE[0]) + '">' + esc(r.c) + '</span>'
        +   '<span class="tag dur">' + esc(r.u) + '</span></div>'
        + '</div>'
        + '<div class="right">'
        +   '<div class="money">¥' + money(r.a) + '</div>'
        +   '<div class="when">' + esc(r.d ? r.d.slice(5) : '') + (r.t ? ' ' + esc(r.t.slice(0, 5)) : '') + '</div>'
        + '</div>'
        + '</div>';
    }
    $('list').innerHTML = html;
  }

  function refresh() { buildChips(); render(); }

  /* ---------- 事件绑定（事件委托，兼容老内核） ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document.body && !t.getAttribute('data-type')) t = t.parentNode;
    if (!t || t === document.body) return;
    var type = t.getAttribute('data-type');
    var val = t.getAttribute('data-val');
    if (type === 'cat') { if (!val) selCat = []; else toggle(selCat, val); refresh(); }
    if (type === 'dur') { if (!val) selDur = []; else toggle(selDur, val); refresh(); }
  }, false);

  $('resetCat').addEventListener('click', function () { selCat = []; refresh(); }, false);
  $('resetDur').addEventListener('click', function () { selDur = []; refresh(); }, false);

  var qi = $('q');
  var timer = null;
  qi.addEventListener('input', function () {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { keyword = qi.value || ''; render(); }, 180);
  }, false);
  // iOS 键盘“搜索”按钮
  qi.addEventListener('keydown', function (e) {
    if (e.keyCode === 13) { keyword = qi.value || ''; render(); qi.blur(); }
  }, false);

  $('sortBtn').addEventListener('click', function () {
    sortMode = sortMode === 'date' ? 'amount' : 'date';
    this.innerHTML = sortMode === 'date' ? '按时间 ↓' : '按金额 ↓';
    render();
  }, false);

  /* ---------- 微信 iOS 字体缩放修正 ---------- */
  if (typeof WeixinJSBridge !== 'undefined' && WeixinJSBridge.invoke) {
    try {
      WeixinJSBridge.invoke('setFontSizeCallback', { fontSize: 0 });
      WeixinJSBridge.on('menu:setfont', function () {
        WeixinJSBridge.invoke('setFontSizeCallback', { fontSize: 0 });
      });
    } catch (err) { /* 忽略 */ }
  }

  refresh();
})();
</script>
